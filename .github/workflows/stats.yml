name: Update stats cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0F2027
          path: profile/stats.svg
          token: ${{ secrets.PAT_1 }}

      - name: Generate top-langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&bg_color=0F2027
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_1 }}

      - name: Generate IMDb pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=IMDB_Movies_ETL&theme=tokyonight&hide_border=true&bg_color=0F2027
          path: profile/pin-imdb.svg
          token: ${{ secrets.PAT_1 }}

      - name: Generate LA Crime pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=End-to-End-LA-Crime-Analytics_Group4&theme=tokyonight&hide_border=true&bg_color=0F2027
          path: profile/pin-lacrime.svg
          token: ${{ secrets.PAT_1 }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update stats cards" || exit 0
          git push
